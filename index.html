<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Presentazione PowerPoint</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #222;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .icon {
    font-size: 4rem;
    margin-bottom: 16px;
    display: block;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 12px;
    color: #4b2a8a;
  }
  p {
    color: #666;
    margin-bottom: 28px;
    font-size: 1rem;
    line-height: 1.5;
  }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: #7c3aed;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    transition: background .2s, transform .1s;
  }
  .btn:hover { background: #6d28d9; }
  .btn:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <span class="icon">📊</span>
    <h1>Presentazione PowerPoint</h1>
    <p>Clicca il pulsante qui sotto per aprire la presentazione.</p>
    <a class="btn"
       href="https://1drv.ms/p/c/8d6073ea3ff6c4c4/IQAJM_lZH9xoSLLH9_IRPfSYAfAJoPBXlWiYcc9bgprW-SU?e=xQvWKK"
       target="_blank"
       rel="noopener noreferrer">
      ▶ Apri presentazione
    </a>
  </div>
</body>
</html>
